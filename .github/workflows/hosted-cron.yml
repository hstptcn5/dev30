name: Hosted schedule runner

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-due:
    runs-on: ubuntu-latest
    env:
      DEV30_HOSTED_URL: ${{ secrets.DEV30_HOSTED_URL }}
      DEV30_CRON_SECRET: ${{ secrets.DEV30_CRON_SECRET }}
    steps:
      - name: Run due Dev30 schedules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEV30_HOSTED_URL:-}" ] || [ -z "${DEV30_CRON_SECRET:-}" ]; then
            echo "Hosted cron secrets are not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${DEV30_CRON_SECRET}" \
            "${DEV30_HOSTED_URL%/}/api/internal/run-due"
